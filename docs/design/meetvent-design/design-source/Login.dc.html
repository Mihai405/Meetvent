<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Meetvent – Autentificare</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A2420}a:hover{color:#2A2420}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; color: #2A2420; display: flex; flex-direction: column; padding: 64px 24px 32px; box-sizing: border-box">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
    <svg width="56" height="40" viewBox="0 0 56 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="{{accent}}"></circle><circle cx="36" cy="20" r="16" fill="none" stroke="#2A2420" stroke-width="2.5"></circle></svg>
    <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Meetvent</span>
    <span style="font-size: 14px; color: #6F6660; text-align: center; line-height: 1.5">Cunoaște oameni noi la evenimentele<br>la care mergi oricum.</span>
    <div style="display: flex; margin-top: 4px">
      <span style="width: 34px; height: 34px; border-radius: 17px; overflow: hidden; position: relative; display: block; border: 2px solid #FFFFFF"><dc-import name="Portrait" who="ioana" crop="face" hint-size="100%,100%"></dc-import></span>
      <span style="width: 34px; height: 34px; border-radius: 17px; overflow: hidden; position: relative; display: block; border: 2px solid #FFFFFF; margin-left: -10px"><dc-import name="Portrait" who="radu" crop="face" hint-size="100%,100%"></dc-import></span>
      <span style="width: 34px; height: 34px; border-radius: 17px; overflow: hidden; position: relative; display: block; border: 2px solid #FFFFFF; margin-left: -10px"><dc-import name="Portrait" who="maria" crop="face" hint-size="100%,100%"></dc-import></span>
      <span style="width: 34px; height: 34px; border-radius: 17px; overflow: hidden; position: relative; display: block; border: 2px solid #FFFFFF; margin-left: -10px"><dc-import name="Portrait" who="alex" crop="face" hint-size="100%,100%"></dc-import></span>
    </div>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px; margin-top: 36px" onSubmit="{{noSubmit}}">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 500">Email</span>
      <span style="height: 48px; border-radius: 14px; border: 1px solid #E8E1DB; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #8A817B">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
        <input type="email" autocomplete="email" placeholder="nume@exemplu.ro" style="flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: #2A2420; min-width: 0">
      </span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 500">Parolă</span>
      <span style="height: 48px; border-radius: 14px; border: 1px solid #E8E1DB; display: flex; align-items: center; gap: 10px; padding: 0 4px 0 14px; color: #8A817B">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <input type="{{pwType}}" autocomplete="current-password" placeholder="Parola ta" style="flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: #2A2420; min-width: 0">
        <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="width: 44px; height: 44px; border: none; background: none; color: #6F6660; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </span>
    </label>
    <a href="#" style="align-self: flex-end; font-size: 13px; font-weight: 600; color: {{deep}}; text-decoration: none; padding: 4px 0">Ai uitat parola?</a>
  </form>

  <a href="Main.dc.html" style="margin-top: 20px; height: 50px; border-radius: 25px; background: {{fill}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Autentificare</a>

  <div style="display: flex; align-items: center; gap: 12px; margin: 22px 0">
    <span style="flex: 1; height: 1px; background: #EFE9E4"></span>
    <span style="font-size: 12px; color: #6F6660">sau</span>
    <span style="flex: 1; height: 1px; background: #EFE9E4"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 48px; border-radius: 24px; border: 1px solid #E8E1DB; background: #FFFFFF; font-size: 14px; font-weight: 500; color: #2A2420">Continuă cu Apple</button>
    <button style="height: 48px; border-radius: 24px; border: 1px solid #E8E1DB; background: #FFFFFF; font-size: 14px; font-weight: 500; color: #2A2420">Continuă cu Google</button>
  </div>

  <div style="margin-top: auto; text-align: center; font-size: 14px; color: #6F6660">Nu ai cont? <a href="Register.dc.html" style="color: {{deep}}; font-weight: 600; text-decoration: none; padding: 12px 4px">Creează unul</a></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F57C3F","options":["#F57C3F","#F59A4A","#EF6F5A","#E8803A"],"section":"Temă"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPw: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F57C3F';
    const rgb = (h) => { const n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const lum = (a) => { const l = a.map((c) => { const v = c / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2]; };
    let d = rgb(accent); let i = 0;
    while (1.05 / (lum(d) + 0.05) < 4.6 && i < 40) { d = d.map((c) => c * 0.96); i++; }
    let f = rgb(accent); let j = 0;
    while (1.05 / (lum(f) + 0.05) < 3.1 && j < 40) { f = f.map((c) => c * 0.97); j++; }
    const css = (a) => 'rgb(' + a.map(Math.round).join(',') + ')';
    const show = this.state.showPw;
    return {
      accent: accent,
      deep: css(d),
      fill: css(f),
      pwType: show ? 'text' : 'password',
      pwLabel: show ? 'Ascunde parola' : 'Arată parola',
      togglePw: () => this.setState({ showPw: !show }),
      noSubmit: (e) => { e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
