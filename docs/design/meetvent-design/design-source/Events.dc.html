<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Meetvent – Evenimente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A2420}a:hover{color:#2A2420}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FCFAF8; font-family: 'DM Sans', system-ui, sans-serif; color: #2A2420">

<header style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border-bottom: 1px solid #EFE9E4">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Evenimente</h1>
      <span style="font-size: 12px; color: #6F6660">{{countLabel}} în Cluj-Napoca</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Caută" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EFE9E4; background: #FFFFFF; color: #2A2420; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
      <button aria-label="Vezi pe hartă" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EFE9E4; background: #FFFFFF; color: #2A2420; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>
      </button>
    </div>
  </div>

  <div role="group" aria-label="Categorie" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: none; height: 34px; padding: 0 14px; border-radius: 17px; font-size: 13px; font-weight: {{c.weight}}; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.border}}">{{c.label}}</button>
    </sc-for>
  </div>

  <div role="group" aria-label="Când" style="display: flex; gap: 22px">
    <sc-for list="{{dates}}" as="d" hint-placeholder-count="3">
      <button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="height: 40px; border: none; background: none; padding: 0; font-size: 14px; font-weight: {{d.weight}}; color: {{d.fg}}; box-shadow: inset 0 -2px 0 {{d.line}}">{{d.label}}</button>
    </sc-for>
  </div>
</header>

<div style="position: absolute; top: 168px; left: 0; right: 0; bottom: 82px; overflow-y: auto; padding: 4px 20px 24px; box-sizing: border-box">
  <sc-for list="{{events}}" as="ev" hint-placeholder-count="6">
    <article style="display: flex; gap: 6px; align-items: center; padding: 12px 0; border-bottom: 1px solid #F2ECE7">
      <a href="EventDetail.dc.html" style="display: flex; gap: 14px; flex: 1; min-width: 0; align-items: center; text-decoration: none; color: #2A2420">
        <span style="width: 68px; height: 68px; border-radius: 12px; overflow: hidden; position: relative; display: block; flex: none">
          <dc-import name="Scene" kind="{{ev.scene}}" hint-size="100%,100%"></dc-import>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1">
          <span style="font-size: 12px; font-weight: 600; color: {{deep}}">{{ev.when}}</span>
          <span style="font-size: 15px; font-weight: 600; line-height: 1.25">{{ev.title}}</span>
          <span style="font-size: 12px; color: #6F6660">{{ev.venue}} · {{ev.going}} merg · <b style="font-weight: 600; color: {{deep}}">{{ev.compat}} compatibili</b></span>
        </span>
      </a>
      <button onClick="{{ev.toggle}}" aria-label="{{ev.saveLabel}}" aria-pressed="{{ev.saved}}" style="width: 44px; height: 44px; border: none; background: none; color: {{ev.saveColor}}; display: flex; align-items: center; justify-content: center; flex: none; margin-right: -10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="{{ev.saveFill}}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
      </button>
    </article>
  </sc-for>
  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 60px 20px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center">
      <span style="font-size: 17px; font-weight: 600">Nimic aici încă</span>
      <span style="font-size: 14px; color: #6F6660">Încearcă altă categorie sau altă perioadă.</span>
    </div>
  </sc-if>
</div>

<nav aria-label="Navigare principală" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: #FFFFFF; border-top: 1px solid #EFE9E4; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
  <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 44px; text-decoration: none; color: #776E68; font-size: 11px; font-weight: 500">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Acasă</a>
  <a href="Events.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 44px; text-decoration: none; color: {{deep}}; font-size: 11px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Evenimente</a>
  <a href="Connect.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 44px; text-decoration: none; color: #776E68; font-size: 11px; font-weight: 500">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="12" r="6"></circle><circle cx="15" cy="12" r="6"></circle></svg>Connect</a>
  <a href="Messages.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 44px; text-decoration: none; color: #776E68; font-size: 11px; font-weight: 500">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Mesaje</a>
  <a href="MyProfile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 44px; text-decoration: none; color: #776E68; font-size: 11px; font-weight: 500">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profil</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F57C3F","options":["#F57C3F","#F59A4A","#EF6F5A","#E8803A"],"section":"Temă"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all', when: 'all', saved: { techno: true, derby: true } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F57C3F';
    const rgb = (h) => { const n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const lum = (a) => { const l = a.map((c) => { const v = c / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2]; };
    let d = rgb(accent); let i = 0;
    while (1.05 / (lum(d) + 0.05) < 4.6 && i < 40) { d = d.map((c) => c * 0.96); i++; }
    let f = rgb(accent); let j = 0;
    while (1.05 / (lum(f) + 0.05) < 3.1 && j < 40) { f = f.map((c) => c * 0.97); j++; }
    const fillC = 'rgb(' + f.map(Math.round).join(',') + ')';
    const css = (a) => 'rgb(' + a.map(Math.round).join(',') + ')';
    const deep = css(d);
    const all = [
      { id: 'jazz', cat: 'music', day: 'today', scene: 'jazz', title: 'Jazz pe acoperiș', when: 'Azi · 21:00', venue: 'Rooftop Central', going: '75', compat: 4 },
      { id: 'startup', cat: 'tech', day: 'week', scene: 'tech', title: 'Cluj Startup Meetup', when: 'Mar, 13 oct · 18:30', venue: 'Cluj Hub', going: '120', compat: 7 },
      { id: 'techno', cat: 'music', day: 'week', scene: 'concert', title: 'Techno Night @ Form Space', when: 'Vin, 16 oct · 22:00', venue: 'Form Space', going: '230', compat: 14 },
      { id: 'derby', cat: 'sport', day: 'week', scene: 'football', title: 'U Cluj – CFR Cluj', when: 'Sâm, 17 oct · 19:30', venue: 'Cluj Arena', going: '1.2k', compat: 21 },
      { id: 'galerii', cat: 'art', day: 'week', scene: 'gallery', title: 'Noaptea Albă a Galeriilor', when: 'Sâm, 17 oct · 18:00', venue: 'Fabrica de Pensule', going: '410', compat: 9 },
      { id: 'standup', cat: 'comedy', day: 'week', scene: 'comedy', title: 'Stand-up în Subsol', when: 'Dum, 18 oct · 20:00', venue: 'Subsol Club', going: '64', compat: 3 },
      { id: 'film', cat: 'film', day: 'week', scene: 'film', title: 'Seară de film coreean', when: 'Dum, 18 oct · 19:00', venue: 'Cinema Victoria', going: '90', compat: 5 },
      { id: 'foto', cat: 'art', day: 'later', scene: 'photo', title: 'Expoziție foto: Oameni din Cluj', when: 'Joi, 29 oct · 18:00', venue: 'Casino – Parcul Central', going: '150', compat: 6 }
    ];
    const s = this.state;
    const events = all
      .filter((e) => s.cat === 'all' || e.cat === s.cat)
      .filter((e) => s.when === 'all' || e.day === s.when || (s.when === 'week' && e.day === 'today'))
      .map((e) => {
        const saved = !!s.saved[e.id];
        return Object.assign({}, e, {
          saved: saved ? 'true' : 'false',
          saveFill: saved ? 'currentColor' : 'none',
          saveColor: saved ? fillC : '#8A817B',
          saveLabel: saved ? 'Elimină din salvate' : 'Salvează evenimentul',
          toggle: () => this.setState({ saved: Object.assign({}, s.saved, { [e.id]: !saved }) })
        });
      });
    const cats = [['all', 'Toate'], ['music', 'Muzică'], ['sport', 'Sport'], ['art', 'Artă'], ['tech', 'Tech'], ['comedy', 'Comedie'], ['film', 'Film']].map(([id, label]) => {
      const on = s.cat === id;
      return { label: label, pressed: on ? 'true' : 'false', bg: on ? fillC : '#FFFFFF', fg: on ? '#FFFFFF' : '#2A2420', border: on ? fillC : '#E8E1DB', weight: on ? '600' : '500', pick: () => this.setState({ cat: id }) };
    });
    const dates = [['all', 'Oricând'], ['today', 'Azi'], ['week', 'Săptămâna asta']].map(([id, label]) => {
      const on = s.when === id;
      return { label: label, pressed: on ? 'true' : 'false', fg: on ? '#2A2420' : '#6F6660', weight: on ? '600' : '500', line: on ? accent : 'transparent', pick: () => this.setState({ when: id }) };
    });
    const n = events.length;
    return {
      deep: deep,
      events: events,
      cats: cats,
      dates: dates,
      empty: n === 0,
      countLabel: n === 1 ? '1 eveniment' : n + ' evenimente'
    };
  }
}
</script>
</body>
</html>
