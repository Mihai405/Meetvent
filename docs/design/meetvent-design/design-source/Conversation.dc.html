<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Meetvent – Conversație</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A2420}a:hover{color:#2A2420}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; color: #2A2420">

<header style="height: 72px; padding: 0 10px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #EFE9E4">
  <a href="Messages.dc.html" aria-label="Înapoi la mesaje" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{deep}}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>
  <a href="ProfileView.dc.html" style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-decoration: none; color: #2A2420">
    <span style="width: 38px; height: 38px; border-radius: 19px; overflow: hidden; position: relative; display: block; flex: none"><dc-import name="Portrait" who="radu" crop="face" hint-size="100%,100%"></dc-import></span>
    <span style="display: flex; flex-direction: column">
      <span style="font-size: 15px; font-weight: 600">Radu</span>
      <span style="font-size: 11px; color: #6F6660">Activ acum</span>
    </span>
  </a>
  <button aria-label="Mai multe opțiuni" style="width: 44px; height: 44px; border: none; background: none; color: #2A2420; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
  </button>
</header>

<div ref="{{setList}}" style="position: absolute; top: 72px; left: 0; right: 0; bottom: 140px; overflow-y: auto; padding: 14px 16px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">

  <a href="EventDetail.dc.html" style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: #FCF7F3; border: 1px solid #F3E8DF; text-decoration: none; color: #2A2420; margin-bottom: 10px">
    <span style="width: 40px; height: 40px; border-radius: 10px; overflow: hidden; position: relative; display: block; flex: none"><dc-import name="Scene" kind="football" hint-size="100%,100%"></dc-import></span>
    <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
      <span style="font-size: 11px; color: #6F6660">V-ați conectat prin</span>
      <span style="font-size: 13px; font-weight: 600">U Cluj – CFR Cluj · Sâm 17 oct</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A817B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
  </a>

  <span style="align-self: center; font-size: 11px; color: #6F6660; padding: 2px 0 6px">Azi</span>

  <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
    <div style="display: flex; justify-content: {{m.justify}}">
      <div style="max-width: 76%; background: {{m.bg}}; color: {{m.fg}}; border-radius: {{m.radius}}; padding: 9px 13px; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; gap: 2px">
        <span>{{m.text}}</span>
        <span style="align-self: flex-end; font-size: 10px; opacity: 0.8">{{m.time}}</span>
      </div>
    </div>
  </sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 84px; height: 56px; display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 0 16px; box-sizing: border-box">
  <sc-for list="{{ice}}" as="q" hint-placeholder-count="3">
    <button onClick="{{q.send}}" style="flex: none; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid {{line}}; background: #FFFFFF; color: {{deep}}; font-size: 13px; font-weight: 500">{{q.text}}</button>
  </sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 10px 16px 26px; box-sizing: border-box; border-top: 1px solid #EFE9E4; display: flex; gap: 10px; align-items: center; background: #FFFFFF">
  <label style="flex: 1; height: 44px; border-radius: 22px; background: #F4F0EC; display: flex; align-items: center; padding: 0 16px">
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Scrie un mesaj</span>
    <input value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="Scrie un mesaj…" style="flex: 1; border: none; background: transparent; outline: none; font-size: 14px; color: #2A2420; min-width: 0">
  </label>
  <button onClick="{{send}}" aria-label="Trimite" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{fill}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"></path></svg>
  </button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F57C3F","options":["#F57C3F","#F59A4A","#EF6F5A","#E8803A"],"section":"Temă"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      msgs: [
        { text: 'Salut! Am văzut că mergi și tu la derby.', mine: false, time: '18:02' },
        { text: 'Da! Merg cu doi prieteni, suntem la peluză.', mine: true, time: '18:05' },
        { text: 'Super, și noi. Prima oară la un U–CFR?', mine: false, time: '18:06' }
      ],
      ice: ['A treia oară, tu?', 'Bem o bere înainte de meci?', 'Pe ce scor pariezi?']
    };
  }
  componentDidUpdate() {
    if (this._list) this._list.scrollTop = this._list.scrollHeight;
  }
  renderVals() {
    const accent = this.props.accent ?? '#F57C3F';
    const rgb = (h) => { const n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const lum = (a) => { const l = a.map((c) => { const v = c / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2]; };
    let d = rgb(accent); let i = 0;
    while (1.05 / (lum(d) + 0.05) < 4.6 && i < 40) { d = d.map((c) => c * 0.96); i++; }
    let f = rgb(accent); let j = 0;
    while (1.05 / (lum(f) + 0.05) < 3.1 && j < 40) { f = f.map((c) => c * 0.97); j++; }
    const fillC = 'rgb(' + f.map(Math.round).join(',') + ')';
    const css = (a) => 'rgb(' + a.map(Math.round).join(',') + ')';
    const deep = css(d);
    const s = this.state;
    const now = () => {
      const t = new Date();
      return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    };
    const push = (text) => {
      const t = String(text || '').trim();
      if (!t) return;
      this.setState({
        draft: '',
        msgs: s.msgs.concat([{ text: t, mine: true, time: now() }]),
        ice: s.ice.filter((q) => q !== t)
      });
    };
    const msgs = s.msgs.map((m) => ({
      text: m.text,
      time: m.time,
      justify: m.mine ? 'flex-end' : 'flex-start',
      bg: m.mine ? deep : '#F4F0EC',
      fg: m.mine ? '#FFFFFF' : '#2A2420',
      radius: m.mine ? '18px 18px 4px 18px' : '18px 18px 18px 4px'
    }));
    return {
      deep: deep,
      fill: fillC,
      line: css(rgb(accent).map((c) => c + (255 - c) * 0.55)),
      msgs: msgs,
      ice: s.ice.map((q) => ({ text: q, send: () => push(q) })),
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') push(s.draft); },
      send: () => push(s.draft),
      setList: (el) => { this._list = el; }
    };
  }
}
</script>
</body>
</html>
